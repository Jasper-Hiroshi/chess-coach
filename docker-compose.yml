services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: chess_coach
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess_coach"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://chess:chess@postgres:5432/chess_coach
      STOCKFISH_PATH: /usr/local/bin/stockfish
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://chess:chess@postgres:5432/chess_coach
      STOCKFISH_PATH: /usr/local/bin/stockfish
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:

