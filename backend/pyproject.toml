[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chess-coach-api"
version = "0.1.0"
description = "Personal chess review and training API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "python-chess>=1.999,<2",
  "python-multipart>=0.0.20,<1",
  "alembic>=1.16,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-cov>=6.2,<7"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
